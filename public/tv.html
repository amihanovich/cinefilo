<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinéfilo — TV</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #status { font-size: 1.5rem; color: rgba(255,255,255,0.4); }
    #message { font-size: 3.5rem; font-weight: 700; text-align: center; padding: 0 48px; display: none; }
    #logo { font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; }
    #icon { font-size: 4rem; }
  </style>
</head>
<body>
  <div id="icon">📺</div>
  <div id="logo">Cinéfilo</div>
  <div id="status">Esperando el teléfono...</div>
  <div id="message"></div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.cinefilo.app';
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, function(event) {
      const data = event.data;
      if (data.type === 'hello') {
        document.getElementById('icon').style.display = 'none';
        document.getElementById('logo').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        const msg = document.getElementById('message');
        msg.textContent = data.text;
        msg.style.display = 'block';
      }
    });

    context.start();
  </script>
</body>
</html>
