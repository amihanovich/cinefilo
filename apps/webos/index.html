<!doctype html>
<!--
  Cáscara de la app de LG webOS: NO tiene lógica propia, solo redirige de
  inmediato a la TV liviana remota (tv-lite.html), servida por el backend en
  Railway. Mismo patrón que apps/tizen (Samsung) y apps/tv (Android): la app
  de verdad vive en tv-lite.html y se actualiza sola con cada redeploy del
  backend, sin reempaquetar el .ipk. Ver apps/webos/README.md.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Miru</title>
<style>
  /* Mismo violeta de marca que la cáscara de Tizen y el splash de Android:
     tapa el instante negro antes de que dispare el redirect. */
  html, body { margin: 0; height: 100%; background: #2A0F5C; }
</style>
</head>
<body>
<script>
  location.replace("https://miru-ai.up.railway.app/tv-lite.html");
</script>
</body>
</html>
